version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'Asia/Seoul'
    commit-message:
      prefix: 'chore(deps)'
    labels:
      - 'dependencies'
      - 'github-actions'
    groups: # 액션 업데이트는 PR 하나로
      actions:
        patterns:
          - '*'

  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'Asia/Seoul'
    commit-message:
      prefix: 'chore(deps)'
    labels:
      - 'dependencies'
    open-pull-requests-limit: 5
    groups: # 마이너·패치는 PR 하나로, 메이저는 개별 PR
      minor-and-patch:
        update-types:
          - 'minor'
          - 'patch'
