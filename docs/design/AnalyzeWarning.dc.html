<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500&family=Noto+Sans+KR:wght@400;500;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #faf9f5; color: #141413; font-family: "Pretendard Variable", Pretendard, Inter, "Noto Sans KR", -apple-system, sans-serif; font-size: 14px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
    a { color: #994d35; text-decoration: none; } a:hover { text-decoration: underline; }
    .i { width: 16px; height: 16px; flex: none; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
    button { font: inherit; cursor: pointer; }
    ul { margin: 0; padding-left: 18px; }
    .mk { background: #f6e7d3; color: #8a5a1f; border-radius: 4px; padding: 1px 5px; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
    .del { background: #f4e3e0; color: #a53a3a; text-decoration: line-through; border-radius: 3px; padding: 0 2px; }
    .add { background: #e4f0e3; color: #27693b; font-weight: 500; border-radius: 3px; padding: 0 2px; }
    .code { margin: 8px 0 0; padding: 12px 14px; border-radius: 8px; background: #181715; color: #faf9f5; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; line-height: 1.6; white-space: pre-wrap; }
    .code .mk { background: rgba(232, 165, 90, 0.28); color: #f6e7d3; }
    .doc { font-size: 16px; line-height: 1.7; color: #3d3d3a; }
    .h2 { margin: 0; font-size: 16px; font-weight: 500; line-height: 1.4; color: #141413; }
    .req { font-size: 12px; font-weight: 500; color: #6c6a64; margin-left: 6px; }
    .kicker { font-size: 12px; font-weight: 500; letter-spacing: 0.5px; color: #6c6a64; }
  </style>
  <style> body { background: #b0b0ad; } </style>
</helmet>
<div style="display: flex; align-items: flex-start; justify-content: center; width: 560px; height: 560px; padding: 40px; background: #b0b0ad;">
  <div style="display: flex; flex-direction: column; gap: 20px; width: 480px; padding: 24px; background: #faf9f5; border-radius: 16px; box-shadow: 0 8px 24px rgba(20, 20, 19, 0.12);">
    <div style="display: flex; align-items: center; justify-content: space-between;">
      <h2 style="margin: 0; font-size: 22px; font-weight: 500; line-height: 1.3; color: #141413;">분석을 시작하기 전에</h2>
      <button type="button" aria-label="닫기" style="display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; border: 0; border-radius: 8px; background: transparent; color: #6c6a64;"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
    </div>
    <div style="display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px; border-radius: 8px; background: #f4ebd1; color: #7a5a0c;">
      <svg class="i" style="width: 18px; height: 18px; margin-top: 1px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
      <div style="display: flex; flex-direction: column; gap: 2px;">
        <div style="font-size: 14px; font-weight: 500; line-height: 1.45;">예제 텍스트 <strong style="font-weight: 600;">5건</strong>이 남아 있습니다</div>
        <div style="font-size: 13px; line-height: 1.45;">예제 값이 그대로 분석되면 미결정 사항과 산정 결과가 부정확해집니다.</div>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 10px;">
      <div style="display: flex; flex-direction: column; gap: 4px;"><span class="kicker">배치 주기</span><span style="font-size: 14px; line-height: 1.6; color: #3d3d3a;"><span class="mk">(예: 매일 09:00 — 실제 주기로 수정하세요)</span></span></div>
      <div style="display: flex; flex-direction: column; gap: 4px;"><span class="kicker">세부사항</span><span style="font-size: 14px; line-height: 1.6; color: #3d3d3a;"><span class="mk">(예: 실행 결과 리포트 — 슬랙 #navi-batch 채널에 발송 건수 게시)</span></span></div>
      <div style="display: flex; flex-direction: column; gap: 4px;"><span class="kicker">세부사항 · 알림톡 템플릿</span><span style="font-size: 14px; line-height: 1.6; color: #3d3d3a;"><span class="mk">(예: [핏펫] #{고객명}님, 생일 축하드려요 …)</span></span></div>
      <div style="display: flex; flex-direction: column; gap: 4px;"><span class="kicker">예외 조건</span><span style="font-size: 14px; line-height: 1.6; color: #3d3d3a;"><span class="mk">(예: 이미 발급받은 유저에게 중복 발급하지 않는다)</span></span></div>
      <span style="font-size: 12px; color: #6c6a64;">외 1건 (정책)</span>
    </div>
    <div style="display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding-top: 4px;">
      <button type="button" style="display: inline-flex; align-items: center; height: 40px; padding: 0 16px; border: 1px solid #e6dfd8; border-radius: 8px; background: #faf9f5; color: #141413; font-size: 14px; font-weight: 500;">그대로 분석</button>
      <button type="button" style="display: inline-flex; align-items: center; height: 40px; padding: 0 16px; border: 0; border-radius: 8px; background: #cc785c; color: #ffffff; font-size: 14px; font-weight: 600;">돌아가서 수정</button>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
