<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500&family=Noto+Sans+KR:wght@400;500;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #faf9f5; color: #141413; font-family: "Pretendard Variable", Pretendard, Inter, "Noto Sans KR", -apple-system, sans-serif; font-size: 14px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
    a { color: #994d35; text-decoration: none; } a:hover { text-decoration: underline; }
    .i { width: 16px; height: 16px; flex: none; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
    button { font: inherit; cursor: pointer; }
  </style>
</helmet>
<div style="display: flex; flex-direction: column; width: 1440px; height: 900px; overflow: hidden; background: #faf9f5;">

  <div style="display: flex; align-items: center; gap: 20px; height: 56px; padding: 0 24px; border-bottom: 1px solid #e6dfd8; background: #faf9f5; flex: none;">
    <div style="display: flex; align-items: center; gap: 8px;">
      <span style="width: 8px; height: 8px; border-radius: 9999px; background: #cc785c;"></span>
      <span style="font-size: 15px; font-weight: 600; color: #141413;">Navi</span>
    </div>
    <span style="width: 1px; height: 20px; background: #e6dfd8;"></span>
    <div style="display: flex; align-items: center; gap: 4px;">
      <span style="font-size: 14px; font-weight: 500; color: #6c6a64; padding: 6px 10px; border-radius: 8px;">업무 보드</span>
      <span style="font-size: 14px; font-weight: 500; color: #6c6a64; padding: 6px 10px; border-radius: 8px;">분석</span>
      <span style="font-size: 14px; font-weight: 500; color: #141413; padding: 6px 10px; border-radius: 8px; background: #efe9de;">구현 확인</span>
    </div>
    <div style="flex: 1;"></div>
    <button type="button" disabled style="display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 14px 0 12px; border: 1px solid #e6dfd8; border-radius: 8px; background: #faf9f5; color: #141413; font-size: 14px; font-weight: 500; opacity: 0.5; cursor: default;">
      <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><path d="M12 7v6"/><path d="M9 10h6"/></svg>
      <span>새 대화</span>
    </button>
  </div>

  <div style="display: flex; flex-direction: column; align-items: center; flex: 1; min-height: 0;">
    <div style="display: flex; flex-direction: column; width: 760px; flex: 1; min-height: 0;">

      <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 112px 0 0; text-align: center;">
        <h1 style="margin: 0; font-family: 'Noto Serif KR', 'Tiempos Headline', Georgia, serif; font-size: 28px; font-weight: 400; line-height: 1.2; letter-spacing: -0.3px; color: #141413;">구현 확인</h1>
        <div style="font-size: 14px; line-height: 1.55; color: #3d3d3a;">코드를 직접 읽고 지금 구현이 어떻게 되어 있는지 답합니다. 어느 서비스의 코드인지는 Navi 가 고릅니다.</div>
        <div style="font-size: 13px; line-height: 1.45; color: #6c6a64;">대화는 저장되지 않습니다. 새로 고치면 사라집니다.</div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 12px; padding: 56px 0 0;">
        <div style="font-size: 12px; font-weight: 500; letter-spacing: 0.5px; color: #6c6a64;">이런 질문을 할 수 있습니다</div>
        <div role="group" aria-label="질문 분류" style="display: flex; align-items: center; gap: 4px;">
          <button type="button" aria-pressed="true" style="display: inline-flex; align-items: center; height: 32px; padding: 0 14px; border: 0; border-radius: 8px; font-size: 13px; font-weight: 500; background: #efe9de; color: #141413;">주문·결제</button>
          <button type="button" aria-pressed="false" style="display: inline-flex; align-items: center; height: 32px; padding: 0 14px; border: 0; border-radius: 8px; font-size: 13px; font-weight: 500; background: transparent; color: #6c6a64;">적립금·쿠폰</button>
          <button type="button" aria-pressed="false" style="display: inline-flex; align-items: center; height: 32px; padding: 0 14px; border: 0; border-radius: 8px; font-size: 13px; font-weight: 500; background: transparent; color: #6c6a64;">배송·반품</button>
          <button type="button" aria-pressed="false" style="display: inline-flex; align-items: center; height: 32px; padding: 0 14px; border: 0; border-radius: 8px; font-size: 13px; font-weight: 500; background: transparent; color: #6c6a64;">회원·등급</button>
          <button type="button" aria-pressed="false" style="display: inline-flex; align-items: center; height: 32px; padding: 0 14px; border: 0; border-radius: 8px; font-size: 13px; font-weight: 500; background: transparent; color: #6c6a64;">알림·자동 작업</button>
          <button type="button" aria-pressed="false" style="display: inline-flex; align-items: center; height: 32px; padding: 0 14px; border: 0; border-radius: 8px; font-size: 13px; font-weight: 500; background: transparent; color: #6c6a64;">화면·노출</button>
        </div>
        <div role="group" aria-label="예시 질문" style="display: flex; flex-wrap: wrap; gap: 6px;">
          <button type="button" style="display: inline-flex; align-items: center; height: 32px; padding: 0 12px; border: 1px solid #e6dfd8; border-radius: 9999px; background: #faf9f5; color: #3d3d3a; font-size: 12px; font-weight: 500;">주문 취소는 어떤 상태까지 가능한가요</button>
          <button type="button" style="display: inline-flex; align-items: center; height: 32px; padding: 0 12px; border: 1px solid #e6dfd8; border-radius: 9999px; background: #faf9f5; color: #3d3d3a; font-size: 12px; font-weight: 500;">가상계좌 입금 기한이 지나면 주문은 어떻게 되나요</button>
          <button type="button" style="display: inline-flex; align-items: center; height: 32px; padding: 0 12px; border: 1px solid #e6dfd8; border-radius: 9999px; background: #faf9f5; color: #3d3d3a; font-size: 12px; font-weight: 500;">구매 확정은 언제 자동으로 되나요</button>
        </div>
      </div>

      <div style="flex: 1;"></div>

      <div style="display: flex; flex-direction: column; gap: 8px; padding: 0 0 32px;">
        <div style="display: flex; align-items: flex-end; gap: 10px; min-height: 56px; padding: 10px 10px 10px 16px; background: #f5f0e8; border: 1px solid #e6dfd8; border-radius: 12px;">
          <span style="flex: 1; padding: 6px 0; font-size: 14px; line-height: 1.45; color: #8e8b82;">구현이 궁금한 점을 물어보세요</span>
          <span style="display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 9999px; background: #e6dfd8; color: #6c6a64; flex: none;">
            <svg class="i" style="width: 14px; height: 14px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 7-7 7 7"/><path d="M12 19V5"/></svg>
          </span>
        </div>
      </div>

    </div>
  </div>
</div>
</x-dc>
</body>
</html>
