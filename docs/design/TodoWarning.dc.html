<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600&family=Inter:wght@400;500;600&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #b0b0ad; color: #141413; font-family: "Pretendard Variable", Pretendard, Inter, "Noto Sans KR", -apple-system, sans-serif; font-size: 14px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
    a { color: #994d35; text-decoration: none; } a:hover { text-decoration: underline; }
    .i { width: 16px; height: 16px; flex: none; }
    button { font: inherit; cursor: pointer; }
  </style>
</helmet>
<div style="display: flex; align-items: flex-start; justify-content: center; width: 560px; height: 560px; padding: 40px; background: #b0b0ad;">
  <div style="display: flex; flex-direction: column; gap: 20px; width: 480px; padding: 24px; background: #faf9f5; border-radius: 16px; box-shadow: 0 8px 24px rgba(20, 20, 19, 0.12);">

    <div style="display: flex; align-items: center; justify-content: space-between;">
      <h2 style="margin: 0; font-size: 22px; font-weight: 500; line-height: 1.3; color: #141413;">Todo로 이동</h2>
      <button type="button" aria-label="닫기 (이동 취소)" style="display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; border: 0; border-radius: 8px; background: transparent; color: #6c6a64;">
        <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </div>

    <div style="display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px; border-radius: 8px; background: #f4ebd1; color: #7a5a0c;">
      <svg class="i" style="width: 18px; height: 18px; margin-top: 1px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
      <div style="display: flex; flex-direction: column; gap: 2px;">
        <div style="font-size: 14px; font-weight: 500; line-height: 1.45;">미결정 <strong style="font-weight: 600;">2건</strong>이 남아 있습니다</div>
        <div style="font-size: 13px; line-height: 1.45;">개발 준비 게이트를 통과하지 않은 태스크입니다. 개발자 역질문이 생길 수 있습니다.</div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; border: 1px solid #e6dfd8; border-radius: 12px; overflow: hidden;">
      <div style="display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid #ebe6df; font-size: 14px; font-weight: 500; color: #27693b;">
        <svg class="i" style="width: 15px; height: 15px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>
        <span>예제 마커 0건</span>
      </div>
      <div style="display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid #ebe6df; font-size: 14px; font-weight: 500; color: #27693b;">
        <svg class="i" style="width: 15px; height: 15px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>
        <span>분석 실행됨</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px; padding: 10px 14px;">
        <div style="display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 500; color: #3d3d3a;">
          <svg class="i" style="width: 15px; height: 15px; color: #6c6a64;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><circle cx="12" cy="12" r="10"/></svg>
          <span>미결정 답변 2건 남음</span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 4px; padding-left: 25px; font-size: 13px; line-height: 1.5; color: #6c6a64;">
          <span>· 마케팅 미허용 유저는 적립금만 발급하고 알림톡은 생략하나요?</span>
          <span>· 배치 결과는 어느 채널에 어떤 형식으로 보고하나요?</span>
        </div>
      </div>
    </div>

    <div style="display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding-top: 4px;">
      <button type="button" style="display: inline-flex; align-items: center; height: 40px; padding: 0 16px; border: 1px solid #e6dfd8; border-radius: 8px; background: #faf9f5; color: #141413; font-size: 14px; font-weight: 500;">그래도 이동</button>
      <button type="button" style="display: inline-flex; align-items: center; height: 40px; padding: 0 16px; border: 0; border-radius: 8px; background: #cc785c; color: #ffffff; font-size: 14px; font-weight: 600;">돌아가서 확인</button>
    </div>

  </div>
</div>
</x-dc>
</body>
</html>
